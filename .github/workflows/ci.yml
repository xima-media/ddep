name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck bin/ddep

  editorconfig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install editorconfig-checker
        run: |
          version=3.7.0
          curl -fsSL "https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v${version}/ec-linux-amd64.tar.gz" -o ec.tar.gz
          tar -xzf ec.tar.gz
          sudo install "$(find . -name 'ec-linux-amd64' -type f | head -1)" /usr/local/bin/editorconfig-checker
      - run: editorconfig-checker

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - run: bats tests/
